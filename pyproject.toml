[project]
name = "clarity-evals"
version = "0.1.0"
description = "Reproducible evaluations for the Clarity animation pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["clarity_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
